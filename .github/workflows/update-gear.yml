name: Update Gear Data
on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sakurashisha.jp products
        run: |
          node - << 'JS'
          const fs=require('fs');
          const cats=['stem','bowl','hmd','base-bottle'];
          const out={updatedAt:new Date().toISOString(),cats:{}};
          (async()=>{
            for(const c of cats){
              try{
                const r=await fetch('https://sakurashisha.jp/collections/'+c+'/products.json?limit=250',{headers:{'User-Agent':'uwasa-dashboard'}});
                if(!r.ok)throw new Error(r.status);
                const j=await r.json();
                const list=(j.products||[]).map(p=>{const v=(p.variants||[])[0]||{};return {id:p.handle,t:p.title,v:p.vendor||'',p:Math.round(parseFloat(v.price||'0')),img:(p.images&&p.images[0]&&p.images[0].src)||'',avail:v.available!==false};}).filter(x=>x.p>0);
                out.cats[c]=list.slice(0,150);
                console.log(c,list.length,'items');
              }catch(e){console.log(c,'FAILED',e.message);}
            }
            // 1件も取れなければ既存を保持（壊さない）
            const total=Object.values(out.cats).reduce((a,l)=>a+l.length,0);
            if(total===0){console.log('no data; keep existing gear.json');process.exit(0);}
            fs.writeFileSync('gear.json',JSON.stringify(out));
          })();
          JS
      - name: Commit
        run: |
          git config user.name "gear-bot"
          git config user.email "gear-bot@users.noreply.github.com"
          git add gear.json
          git diff --cached --quiet || git commit -m "chore: update gear.json"
          git push
